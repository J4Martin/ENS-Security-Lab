name: ENS HCA - Pinned Local Solidity Tests

# Run exclusively in the dedicated research fork. Never connects to RPC,
# deploys to public networks, or accesses secrets/production services.
on:
  push:
    branches:
      - lab/hca-onchain-local-20261028
    paths:
      - .github/workflows/ens-hca-solidity-lab.yml
      - security-tests/HcaCrossAccountReplay.t.sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hca-local-validator:
    if: github.repository == 'J4Martin/ENS-Security-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOUNDRY_ETH_RPC_URL: ''
      ETH_RPC_URL: ''
      CI: 'true'
    steps:
      - name: Checkout official mainnet-linked ENSv2 contracts source (separate from apps fork)
        uses: actions/checkout@v4
        with:
          repository: ensdomains/contracts-v2
          ref: 4f47cbcc11462fb413196e6b5c0f8090247a6c08
          path: ens-contracts
          submodules: recursive
          persist-credentials: false

      - name: Checkout our test additions (research fork only)
        uses: actions/checkout@v4
        with:
          repository: J4Martin/ENS-Security-Lab
          ref: lab/hca-onchain-local-20261028
          path: lab-source
          persist-credentials: false

      - name: Install local EVM and Solidity testing tools
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify pin, runner, and local-only configuration
        working-directory: ens-contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4f47cbcc11462fb413196e6b5c0f8090247a6c08"
          forge --version
          test -z "${ETH_RPC_URL}"
          test -z "${FOUNDRY_ETH_RPC_URL}"
          echo "Official mainnet-linked contracts-v2 source confirmed; no RPC configured."

      - name: Solidity - HCA owner/session validation (isolated local EVM)
        working-directory: ens-contracts/contracts
        shell: bash
        run: |
          set -euo pipefail
          forge test --match-path test/unit/hca/HCAOwnerAndSessionValidator.t.sol --fuzz-runs 256 -vv

      - name: Solidity - HCA funding/session validation (isolated local EVM)
        working-directory: ens-contracts/contracts
        shell: bash
        run: |
          set -euo pipefail
          forge test --match-path test/unit/hca/HCAFundingSessionValidator.t.sol --fuzz-runs 256 -vv

      - name: Stage our adversarial tests in the ephemeral local checkout
        shell: bash
        run: |
          set -euo pipefail
          cp lab-source/security-tests/HcaCrossAccountReplay.t.sol ens-contracts/contracts/test/unit/hca/HcaCrossAccountReplay.t.sol
          echo "Copied a test ONLY inside this runner. The upstream GitHub repository remains untouched."

      - name: New adversarial check - reject HCA A signature on HCA B
        working-directory: ens-contracts/contracts
        shell: bash
        run: |
          set -euo pipefail
          forge test --match-path test/unit/hca/HcaCrossAccountReplay.t.sol --match-test 'test_lab_' -vv
